name: Deploy 3D Symbol Web Preview

on:
  push:
    branches:
      - main
    paths:
      - "shaders/3d-ascii/**"
      - ".github/workflows/deploy-ascii3d-preview.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload 3D Symbol shader site
        uses: actions/upload-pages-artifact@v4
        with:
          path: shaders/3d-ascii

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
